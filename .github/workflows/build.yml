name: Build

on:
  push:
    branches: [ main, Development ]
  pull_request:
    branches: [ main, Development ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BasicFinance.sln
      - name: Audit dependencies
        run: dotnet list src/BasicFinance.Web/BasicFinance.Web.csproj package --vulnerable --include-transitive
      - name: Build
        run: dotnet build BasicFinance.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test BasicFinance.sln --configuration Release --no-build --no-restore
